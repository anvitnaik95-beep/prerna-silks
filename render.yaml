# Render.com Deployment Blueprint
# This file configures automatic deployment on Render.com (free tier)

services:
  # Full-stack Web Service (Backend + Frontend served together)
  - type: web
    name: prerna-silks
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npx vite build && cd ../server && npm install
    startCommand: cd server && node server.js
